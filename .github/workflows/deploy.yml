name: Deploy site
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the validated site
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build:js && npm run check:grids
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements-grids.txt
      - run: python -m pip install -r tools/requirements-grids.txt
      - run: python tools/test-grid-posters.py
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: npx playwright install --with-deps chromium
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - run: npm run build:css && npm run assets:cv && npm run check:site && npm run check:browser
      - uses: actions/upload-artifact@v4
        with:
          name: validated-site
          path: _site/
          retention-days: 7
  publish:
    needs: check
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: validated-site
          path: _site
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
